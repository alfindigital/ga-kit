<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      connect-src 'self' https://www.youtube.com https://noembed.com https://*.youtube.com;
      frame-src https://www.youtube.com https://youtube.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " />
    
    <!-- Additional Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="GAKit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GAKit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="msapplication-TileColor" content="#1a1a2e" />
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    
    <title>GAKit – Ads Toolkit</title>
    <meta name="description" content="Free toolkit for Google Advertisers: UTM Builder, QR Generator, Keyword Tools & more" />
    <meta name="author" content="GAKit" />

    <!-- Fonts: Inter Tight (display) + Inter (body) + JetBrains Mono — native-app feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

    <!-- Open Graph -->
    <meta property="og:title" content="GAKit – Free Ads Toolkit for Google Advertisers" />
    <meta property="og:description" content="Free toolkit for Google Advertisers: UTM Builder, QR Generator, Keyword Combiner, YouTube Finder & more. No signup required." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gakit.lovable.app" />
    <meta property="og:site_name" content="GAKit" />
    <meta property="og:image" content="https://gakit.lovable.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GAKit – Free Ads Toolkit for Google Advertisers" />
    <meta name="twitter:description" content="Free toolkit for Google Advertisers: UTM Builder, QR Generator, Keyword Combiner, YouTube Finder & more." />
    <meta name="twitter:image" content="https://gakit.lovable.app/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
